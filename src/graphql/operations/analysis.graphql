# The Analysis tab's payload. One request: lap times per driver, the strategy
# behind them, and the pit stops that separate the stints.
#
# `isOutlier` comes back per lap rather than being decided in the component. The
# rule for what counts as a representative lap is a fact about the race, so it
# belongs on the server where it is tested, not in a chart that happens to draw
# the laps.
query RaceAnalysis($slug: String!) {
  race(slug: $slug) {
    id
    slug
    laps
    dataTier
    meeting {
      name
      season
    }
    analysis {
      lapTimes {
        driver {
          id
          code
          name
        }
        team {
          id
          name
          color
        }
        laps {
          lap
          time
          isOutlier
        }
        pace {
          best
          median
          consistency
          lapsCounted
          lapsExcluded
        }
      }
      stints {
        stintNumber
        lapStart
        lapEnd
        compound
        driver {
          id
          code
        }
        team {
          color
        }
      }
      pitStops {
        lap
        durationSeconds
        # A red flag arrives from upstream as a pit stop for the whole field;
        # this is how the strategy chart tells the two apart.
        underStoppage
        driver {
          id
          code
        }
      }
    }
  }
}

# Two drivers inside one race. Its own operation rather than a field on
# RaceAnalysis, because the pair keys the cache entry and the rest of the
# analysis payload — every lap time of every driver — does not vary by it.
query HeadToHead($slug: String!, $driverA: String!, $driverB: String!) {
  race(slug: $slug) {
    slug
    laps
    meeting {
      name
      season
    }
    results {
      finalPosition
      driver {
        code
        name
      }
    }
    analysis {
      headToHead(driverA: $driverA, driverB: $driverB) {
        lapsAheadA
        lapsAheadB
        a {
          driver { code name }
          team { name color }
          finalPosition
          pace { best median consistency lapsCounted }
        }
        b {
          driver { code name }
          team { name color }
          finalPosition
          pace { best median consistency lapsCounted }
        }
        laps {
          lap
          positionDelta
          timeDelta
        }
      }
    }
  }
}
