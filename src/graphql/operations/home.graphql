# The lineup shown on the home page. Deliberately narrow: the page declares
# exactly what it needs, and codegen makes that a compile-time contract rather
# than a shape it hopes the resolver still returns.
query HomeLineup($season: Int!) {
  driverStandings(season: $season) {
    position
    points
    driver {
      code
      name
      number
    }
    team {
      name
      color
    }
  }
}

# The race the landing page leads with. `Query.races` orders by date ascending
# and takes no `featured` argument, so the pick happens in getFeaturedRace():
# the first race flagged featured if there is one, otherwise the most recent.
# Nothing is flagged yet — the mutation that sets it is M3 — so today this
# resolves to the latest race and starts honouring the flag the moment one
# exists, with no change to the query.
query HomeFeature {
  races(first: 100) {
    edges {
      node {
        id
        slug
        laps
        type
        isFeatured
        meeting {
          name
          country
          circuitName
          round
          season
        }
      }
    }
  }
}

# Every race of a season, for the home page's progress bar and countdown.
# `first: 100` rather than the library's 24 — a season is at most 24 grands
# prix plus its sprints, and a page boundary here would under-count the season
# rather than showing a "next page" the caller could follow.
query SeasonSchedule($season: Int!) {
  races(season: $season, first: 100) {
    edges {
      node {
        slug
        date
        type
        meeting {
          name
          round
        }
      }
    }
  }
}

# The season the site is currently about, from app_config — the same value the
# ingest cron walks. See Query.activeSeason.
query ActiveSeason {
  activeSeason
}
