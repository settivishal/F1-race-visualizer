name: Migrate

# Migrations are applied from one runner, from reviewed code that is already on
# a protected branch — never from a developer's machine, where DATABASE_URL is
# whatever .env happens to hold.
on:
  push:
    branches: [main, dev]
    paths:
      - 'src/db/migrations/**'
  # Runnable by hand, so the runner and its secrets can be proven against dev
  # before a real migration depends on them. Applying migrations is idempotent:
  # drizzle-kit skips what the journal says is already applied.
  #
  # The target is an input rather than the branch, because at release time the
  # two disagree: the migration files reach `dev` first, and production has to
  # be migrated *before* the merge to `main` deploys code that reads the new
  # columns. Without this, the only ordering available is the merge itself,
  # which races the Vercel deploy.
  workflow_dispatch:
    inputs:
      target:
        description: Which database to migrate
        type: choice
        options: [dev, prod]
        default: dev

# Two pushes in quick succession must not apply migrations concurrently.
concurrency:
  group: migrate-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # One step per target rather than one step picking a target. An earlier
      # version selected the URL with `ref == 'main' && A || B`, which silently
      # falls through to B whenever A is empty — so a misconfigured production
      # secret would have migrated the dev database from a push to main.
      - name: Apply migrations to production
        if: github.ref_name == 'main' || inputs.target == 'prod'
        run: |
          test -n "$DATABASE_URL" || { echo "::error::DATABASE_URL secret is empty"; exit 1; }
          pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # A push to any branch but main, or a hand run that did not ask for prod.
      # Spelled out rather than `!` of the step above, so a future third target
      # cannot fall through to the dev database by default.
      - name: Apply migrations to the dev branch database
        if: (github.event_name == 'push' && github.ref_name != 'main') || (github.event_name == 'workflow_dispatch' && inputs.target == 'dev')
        run: |
          test -n "$DATABASE_URL" || { echo "::error::DATABASE_URL_DEV secret is empty"; exit 1; }
          pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_DEV }}
